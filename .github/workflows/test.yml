name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/mcp/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: python3 -m unittest discover -s tests -q
      - run: npm ci --ignore-scripts --prefix tests/mcp
      - run: npm test --prefix tests/mcp
      - run: npm audit --audit-level=moderate --prefix tests/mcp
      - run: uv export --script plugins/claude/mcp/server.py --format requirements-txt --no-hashes --output-file /tmp/acdc-runtime-requirements.txt
      - run: uvx pip-audit -r /tmp/acdc-runtime-requirements.txt --progress-spinner off
